# This is the mod metadata file for GetsKeeper. It is processed by the `generateModMetadata`
# Gradle task, which substitutes the ${...} placeholders with the values from gradle.properties.
# The finished file lands in build/generated/sources/modMetadata/META-INF/neoforge.mods.toml.
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/kdxiaoyi/GetsKeeper/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="getskeeper.png" #optional
authors="${mod_authors}" #optional
description='''${mod_description}'''

# GetsKeeper installs on both sides. The client half owns every screen (pickup, trust dialogs,
# privacy & security); the server half is the authority for trust lists, source records and
# authorizations. Running the mod on only one side is not supported and is rejected below.
[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
